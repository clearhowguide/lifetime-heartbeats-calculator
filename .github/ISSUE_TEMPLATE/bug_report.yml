name: Bug report
description: Report a reproducible calculator problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to reproduce the problem.
      placeholder: |
        1. Open...
        2. Enter...
        3. Click...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox, Chrome, Safari...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Linux, Windows, macOS, Android, iOS...

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
